name: Build site
on:
  push:
    branches: [main]
    paths: ["data/**", "assets/**", "build.py", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fonts for share images
        run: |
          mkdir -p .fonts && cd .fonts
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/apache/permanentmarker/PermanentMarker-Regular.ttf
          curl -fsSLO https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans/fonts/complete/ttf/IBMPlexSans-Bold.ttf
          curl -fsSLO https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans/fonts/complete/ttf/IBMPlexSans-Medium.ttf
      - run: python3 build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild site from data"
          git push
