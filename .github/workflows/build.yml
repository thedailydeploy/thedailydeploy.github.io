name: Build site and share images

# Runs whenever the source data or the site code changes on main.
# Draws share images for new or changed days, rebuilds every page, and commits the result.
on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - "build.py"
      - "tools/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Build
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A og 2026 2027 2028 index.html archive 404.html sitemap.xml robots.txt data/search.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to update."; exit 0; fi
          git commit -m "Build pages and share images"
          git push
